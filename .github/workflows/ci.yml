name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-kit:
    name: Verify kit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install declared verification dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify core, schemas, adapters, installer and runtime
        run: bash scripts/check-kit.sh --test

      - name: Check whitespace
        run: git diff --check

      - name: No internal identifiers leaked
        run: |
          if git grep -nIiE 'quintegro|partfinder|thor[-_]|/home/[a-z]+/work' -- . ':!docs/readme-ru.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Internal identifier found — keep the kit generic (use placeholders: acme, PROJ, your-org)."
            exit 1
          fi
          echo "Clean: no internal identifiers in tracked files."
