# pipeline.yaml — the SDLC pipeline roster: which specialist agents are active, and which are off.
#
# SINGLE SOURCE OF TRUTH for the agent set. To drop an agent from EVERY harness (Claude, pi, opencode,
# and the Qwen/Crush prose), set `enabled: false` here and run:
#
#     ./setup.sh --pipeline          # (or: bash scripts/apply-pipeline.sh)
#
# That step reconciles `.claude/agents/<name>.md`  <->  `<name>.md.disabled` (so Claude stops
# discovering it), re-runs the pi/opencode porters — which skip disabled agents and any command bound
# only to one — and re-verifies with check-kit. Re-enable by setting `true` and re-running. The flip is
# reversible and loses nothing; it shows up in git as a rename so your pipeline choices stay legible.
#
# Roles:
#   core-phase  — owns one or more of the 8 pipeline phases. Disabling one BREAKS that phase unless you
#                 run its command (.claude/commands/<cmd>.md) by hand. check-kit warns if a core phase
#                 is off. You normally leave all five core-phase agents enabled.
#   specialist  — invoked inside a phase when the plan flags that kind of work. Safe to disable.
#   utility     — not a pipeline phase at all; an ad-hoc tool. Safe to disable.
#
# Parser: scripts/pipeline_config.py reads this with a tiny stdlib YAML SUBSET. Keep the exact shape
# below — `agents:` then 2-space-indented `<name>:` then 4-space-indented `key: value` attributes,
# with inline `[a, b]` lists. Do not introduce other YAML features (anchors, multi-line scalars, etc.).

agents:
  planner:
    role: core-phase
    phases: [1, 2]
    commands: [spec, clarify]
    enabled: true
    note: "spec + clarify — read the Jira ticket, write spec.md, resolve open questions"

  tech-designer:
    role: core-phase
    phases: [3, 4]
    commands: [plan, tasks]
    enabled: true
    note: "plan + tasks — architecture/data model/contracts, then the ordered AC-traceable task list"

  engineer:
    role: core-phase
    phases: [5, 8]
    commands: [implement, pr]
    enabled: true
    note: "implement one task at a time with Serena edits; open the [WIP] PR"

  qa-lead:
    role: core-phase
    phases: [6]
    commands: [test]
    enabled: true
    note: "test — map each AC to a testify table-driven test; drive task lint/test green"

  go-code-reviewer:
    role: core-phase
    phases: [7]
    commands: [review]
    enabled: true
    note: "review — multi-pass Go review + spec<->code drift; bounce every blocker"

  devops-lead:
    role: specialist
    phases: [5]
    commands: []
    enabled: true
    note: "infra slice of a story (Taskfile/Docker/Helm/CI). Disable if your team has no infra work."

  rlm:
    role: utility
    phases: []
    commands: [rlm]
    enabled: true
    note: "recursive solver for too-big read-only tasks. Not a pipeline phase; safe to disable."
