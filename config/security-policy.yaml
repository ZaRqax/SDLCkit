schema_version: 2
# Effects are enforced by sdlc/policy.py, adapters and native harness permissions.
policy:
  external_write: approval_required
  destructive_actions: forbidden
  deny: []
effects:
  local: [read, observe, local_edit, local_write, test, patch, commit, local_branch, report]
  approval_required: [external_write, push, publish, package_install, migration, infrastructure_change]
  forbidden: [destructive, force_push, merge, auto_merge, deploy, secret_read, secret_exposure]
secrets:
  never_read_or_commit: [.env, "**/.env", private_keys, session_cookies]
generated_code:
  patterns_from: project.generated_paths
scope:
  projects_from: workspace.projects
  paths_from: workspace.allowed_paths
  repository_instructions: preserve_existing
# An approval cannot waive forbidden effects or inherited deny rules.
